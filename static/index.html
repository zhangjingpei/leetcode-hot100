<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23ff9432%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-size=%2713%27 font-weight=%27800%27 fill=%27%23fff%27 text-anchor=%27middle%27 font-family=%27Arial%27%3ELC%3C/text%3E%3C/svg%3E">
  <title>LeetCode Hot 100 · 图解刷题教程</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/list.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-logo">LC</span>
        <span class="brand-name">Hot 100 · 图解刷题</span>
      </a>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-text" id="progressText">0 / 100</span>
      </div>
    </div>
  </header>

  <nav class="cat-nav" id="catNav"></nav>

  <div class="toolbar">
    <input id="searchBox" class="search-box" type="text" placeholder="🔍 搜索题目（编号 / 中文 / 英文）…">
    <div class="diff-filter" id="diffFilter">
      <button class="chip" data-diff="简单">简单</button>
      <button class="chip" data-diff="中等">中等</button>
      <button class="chip" data-diff="困难">困难</button>
    </div>
  </div>

  <main class="container" id="list"></main>

  <footer class="footer">
    力扣 Hot 100 · 每题配 Python 题解与 2D 算法动画 · 数据仅供学习交流，题目版权归 LeetCode 所有
  </footer>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/list.js"></script>
</body>
</html>

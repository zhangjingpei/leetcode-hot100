      - heading "思路讲解" [level=2] [ref=e36]
      - generic [ref=e37]:
        - paragraph [ref=e38]: 全排列 = 「每个位置依次选一个没用过的数」：第 0 位有 n 种选法，第 1 位有 n-1 种……走到叶子就收集一个排列。
        - paragraph [ref=e39]:
          - text: 用
          - code [ref=e40]: used[]
          - text: 标记哪些数已被当前路径占用：进入下一层前 做选择（标记 + 加入 path），递归返回后 撤销选择（取消标记 + 弹出 path）——这一来一回就是「回溯」。
        - paragraph [ref=e41]: n 个元素每个都选一遍才到叶子，叶子共 n! 个，是典型的指数级搜索。
      - list [ref=e42]:
        - listitem [ref=e43]:
          - text: 维护
          - code [ref=e44]: path
          - text: （当前排列）与
          - code [ref=e45]: used[]
          - text: （占用标记）
        - listitem [ref=e46]:
          - text: 若
          - code [ref=e47]: path
          - text: 长度 == n：收集一个排列，返回
        - listitem [ref=e48]:
          - text: 否则遍历每个未被使用的
          - code [ref=e49]: nums[i]
          - text: ：标记 → 加入 path → 递归
        - listitem [ref=e50]: 递归返回后弹出 path、清除标记（回溯）

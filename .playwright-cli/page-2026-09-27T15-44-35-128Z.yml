      - generic [ref=e60]:
        - button "复制代码" [ref=e61] [cursor=pointer]
        - code [ref=e63]: "class Solution: def permute(self, nums: List[int]) -> List[List[int]]: res, path, used = [], [], [False] * len(nums) def dfs(): if len(path) == len(nums): # 填满 n 位，收集排列 res.append(path[:]) return for i in range(len(nums)): # 每层尝试每个没用过的数 if used[i]: continue used[i] = True # 做选择 path.append(nums[i]) dfs() # 进入下一层 path.pop() # 撤销选择（回溯） used[i] = False dfs() return res"

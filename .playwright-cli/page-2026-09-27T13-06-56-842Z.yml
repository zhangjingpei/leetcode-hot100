    - generic [ref=f4e39]:
      - heading "思路讲解" [level=2] [ref=f4e40]
      - generic [ref=f4e41]:
        - paragraph [ref=f4e42]:
          - text: 面积 =
          - code [ref=f4e43]: min(左高, 右高) × 宽度
          - text: 。左右指针从两端开始，此时宽度最大。
        - paragraph [ref=f4e44]: "**贪心移动**：短板决定了水面高度，移动长板不可能让面积变大（宽度变小、高度仍被短板限制），所以每次**移动短板那一侧**才有可能找到更大的面积。"
        - paragraph [ref=f4e45]: 每次移动后计算新面积并更新最大值，直到两指针相遇。这个「每次排除一个不可能更优的候选」的论证保证了正确性。
      - list [ref=f4e46]:
        - listitem [ref=f4e47]:
          - code [ref=f4e48]: l = 0, r = n-1
          - text: ，
          - code [ref=f4e49]: best = 0
        - listitem [ref=f4e50]:
          - text: 计算当前面积
          - code [ref=f4e51]: min(height[l], height[r]) * (r - l)
          - text: ，更新
          - code [ref=f4e52]: best
        - listitem [ref=f4e53]:
          - text: 若
          - code [ref=f4e54]: height[l] < height[r]
          - text: ：
          - code [ref=f4e55]: l += 1
          - text: （短板在左）；否则
          - code [ref=f4e56]: r -= 1
        - listitem [ref=f4e57]:
          - text: 重复直到
          - code [ref=f4e58]: l == r
          - text: ，返回
          - code [ref=f4e59]: best

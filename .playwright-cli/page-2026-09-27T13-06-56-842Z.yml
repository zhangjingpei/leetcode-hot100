        - code [ref=f4e72]: "class Solution: def maxArea(self, height: List[int]) -> int: l, r = 0, len(height) - 1 best = 0 while l < r: area = min(height[l], height[r]) * (r - l) best = max(best, area) if height[l] < height[r]: l += 1 # 移动短板才可能更优 else: r -= 1 return best"

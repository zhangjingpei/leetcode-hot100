    - generic [ref=f1e40]:
      - heading "思路讲解" [level=2] [ref=f1e41]
      - generic [ref=f1e42]:
        - paragraph [ref=f1e43]:
          - text: 最直觉的做法是暴力枚举所有
          - code [ref=f1e44]: (i, j)
          - text: 组合，时间复杂度 O(n²)。
        - paragraph [ref=f1e45]:
          - text: 更优的方法是**用哈希表换取时间**：遍历数组时，对每个数
          - code [ref=f1e46]: x
          - text: ，我们先问一句「
          - code [ref=f1e47]: target - x
          - text: 之前出现过吗？」——哈希表可以 O(1) 回答这个问题。
        - paragraph [ref=f1e48]: 所以只需一遍扫描：每个数先查哈希表里有没有自己的「另一半」，有就直接返回两个下标；没有就把自己的「值 → 下标」存进哈希表，继续往后走。
      - list [ref=f1e49]:
        - listitem [ref=f1e50]:
          - text: 新建哈希表
          - code [ref=f1e51]: seen
          - text: ，用于记录已遍历过的
          - code [ref=f1e52]: 值 → 下标
          - text: 映射
        - listitem [ref=f1e53]:
          - text: 遍历数组，对当前
          - code [ref=f1e54]: nums[i]
          - text: 计算
          - code [ref=f1e55]: need = target - nums[i]
        - listitem [ref=f1e56]:
          - text: 若
          - code [ref=f1e57]: need
          - text: 存在于
          - code [ref=f1e58]: seen
          - text: ，说明之前某个下标
          - code [ref=f1e59]: j
          - text: 满足
          - code [ref=f1e60]: nums[j] + nums[i] = target
          - text: ，返回
          - code [ref=f1e61]: "[seen[need], i]"
        - listitem [ref=f1e62]:
          - text: 否则把
          - code [ref=f1e63]: seen[nums[i]] = i
          - text: 存入哈希表，继续遍历
        - listitem [ref=f1e64]: 遍历结束仍未找到则返回空（题目保证有解，实际不会走到）

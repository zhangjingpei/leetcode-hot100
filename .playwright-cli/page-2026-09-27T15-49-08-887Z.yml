        - code [ref=f2e63]: "class Solution: def findKthLargest(self, nums: List[int], k: int) -> int: import heapq heap = [] # 小顶堆，最多 k 个 for x in nums: heapq.heappush(heap, x) if len(heap) > k: heapq.heappop(heap) # 弹掉最小的 return heap[0] # 堆顶 = 第 k 大"

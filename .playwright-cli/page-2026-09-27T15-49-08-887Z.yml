      - heading "思路讲解" [level=2] [ref=f2e41]
      - generic [ref=f2e42]:
        - paragraph [ref=f2e43]: 维护一个大小为 k 的小顶堆：遍历数组逐个 push；堆超过 k 时弹出堆顶（当前最小）。扫完后堆里恰好是最大的 k 个数，堆顶就是第 k 大。
        - paragraph [ref=f2e44]: 为什么小顶堆而不是大顶堆？大顶堆要装下全部 n 个；小顶堆永远只留 k 个「擂主」，规模恒定 → O(n log k)，且当 k ≪ n 时远快于排序。
        - paragraph [ref=f2e45]: O(n) 正解是快速选择（partition 后只递归一侧），期望 O(n)；面试常两者都写。
      - list [ref=f2e46]:
        - listitem [ref=f2e47]: 建空堆，遍历 nums
        - listitem [ref=f2e48]: push 当前数并上浮（siftUp，O(log k)）
        - listitem [ref=f2e49]: 堆大小 > k → 弹出堆顶（换到尾 pop，再下沉 siftDown）
        - listitem [ref=f2e50]: 遍历结束返回堆顶

    - generic [ref=f2e40]:
      - heading "思路讲解" [level=2] [ref=f2e41]
      - generic [ref=f2e42]:
        - paragraph [ref=f2e43]: 这是一道经典的递归入门题。观察发现：整棵树的镜像 = 根不变 + 左子树是原右子树的镜像 + 右子树是原左子树的镜像。
        - paragraph [ref=f2e44]:
          - text: 于是递归定义呼之欲出：先递归翻转左右子树，再交换根的左右指针即可。递归的终点（base case）是空节点，直接返回
          - code [ref=f2e45]: None
          - text: 。
        - paragraph [ref=f2e46]: 也可以用 BFS/DFS 迭代实现：每弹出一个节点就交换它的两个孩子。
      - list [ref=f2e47]:
        - listitem [ref=f2e48]:
          - text: 递归出口：
          - code [ref=f2e49]: root
          - text: 为空，返回
          - code [ref=f2e50]: None
        - listitem [ref=f2e51]:
          - text: 递归翻转左子树：
          - code [ref=f2e52]: left = invertTree(root.left)
        - listitem [ref=f2e53]:
          - text: 递归翻转右子树：
          - code [ref=f2e54]: right = invertTree(root.right)
        - listitem [ref=f2e55]:
          - text: 交换当前节点的左右孩子：
          - code [ref=f2e56]: root.left, root.right = right, left
        - listitem [ref=f2e57]:
          - text: 返回
          - code [ref=f2e58]: root

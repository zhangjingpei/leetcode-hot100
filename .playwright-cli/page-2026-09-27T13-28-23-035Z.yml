        - code [ref=f5e68]: "class Solution: def rotate(self, matrix: List[List[int]]) -> None: n = len(matrix) # 1) 沿主对角线转置 for i in range(n): for j in range(i + 1, n): matrix[i][j], matrix[j][i] = matrix[j][i], matrix[i][j] # 2) 每行左右翻转 for row in matrix: l, r = 0, n - 1 while l < r: row[l], row[r] = row[r], row[l] l, r = l + 1, r - 1"
